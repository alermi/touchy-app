version: '3'

services:


# Backend container
  server:
    build: ./server
    expose:
      - ${SERVER_PORT}
    environment:
      CLIENT_URL: ${CLIENT_URL}
      SERVER_PORT: ${SERVER_PORT}
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    volumes:
      - ./server/app.js:/srv/app/touchy-server/app.js
      - ./server/bin:/srv/app/touchy-server/bin
      - ./server/routes:/srv/app/touchy-server/routes
    command: npm start

# Client container

  client:
    build: ./client
    expose:
      - ${REACT_APP_PORT}
    environment:
      REACT_APP_PORT: ${REACT_APP_PORT}
      REACT_APP_SERVER_URL: ${REACT_APP_SERVER_URL}
    ports:
      - ${REACT_APP_PORT}:${REACT_APP_PORT}
    volumes:
      - ./client/src:/srv/app/touchy-client/src
    links:
      - server
    command: npm start